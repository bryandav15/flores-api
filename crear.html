<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores — Agregar flor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="sidebar" role="navigation" aria-label="Menú principal">
    <div class="sidebar-logo">
        Flores API
        <span>Panel de gestión</span>
    </div>
    <a href="index.html" class="nav-item">🏠 Inicio</a>
    <a href="lista.html" class="nav-item">🌸 Ver flores</a>
    <a href="crear.html" class="nav-item active" aria-current="page">➕ Agregar flor</a>
    <a href="buscar.html" class="nav-item">🔍 Buscar</a>
</nav>

<div class="main">
    <div class="topbar">Agregar nueva flor</div>
    <div class="content">

        <div class="form-card">
            <div class="form-row">
                <label for="c-nombre">Nombre <span class="required" aria-hidden="true">*</span><span class="sr-only">(requerido)</span></label>
                <input type="text" id="c-nombre" placeholder="ej: Rosa Roja" required aria-required="true">
            </div>
            <div class="form-cols">
                <div class="form-row">
                    <label for="c-color">Color</label>
                    <input type="text" id="c-color" placeholder="ej: rojo">
                </div>
                <div class="form-row">
                    <label for="c-familia">Familia</label>
                    <input type="text" id="c-familia" placeholder="ej: Rosaceae">
                </div>
            </div>
            <div class="form-row">
                <label for="c-descripcion">Descripción</label>
                <input type="text" id="c-descripcion" placeholder="ej: Flor clásica de jardín">
            </div>
            <div class="form-cols">
                <div class="form-row">
                    <label for="c-precio">Precio</label>
                    <input type="number" id="c-precio" placeholder="ej: 25.00" step="0.01" min="0">
                </div>
                <div class="form-row">
                    <label for="c-temporada">Temporada</label>
                    <select id="c-temporada">
                        <option value="">-- ninguna --</option>
                        <option value="primavera">Primavera</option>
                        <option value="verano">Verano</option>
                        <option value="otoño">Otoño</option>
                        <option value="invierno">Invierno</option>
                        <option value="todo el año">Todo el año</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <label for="c-disponible">Disponible</label>
                <select id="c-disponible">
                    <option value="true">Sí</option>
                    <option value="false">No</option>
                </select>
            </div>
            <div class="form-actions">
                <button class="btn-primary" onclick="crearFlor()">Guardar flor</button>
                <button class="btn-secondary" onclick="limpiarCrear()">Limpiar</button>
            </div>
        </div>

    </div>
</div>

<output class="toast" id="toast" aria-live="polite" aria-atomic="true"></output>

<script>
const BASE = 'http://localhost:8080/api/flores';

async function crearFlor() {
    const nombre = document.getElementById('c-nombre').value.trim();
    if (!nombre) { toast('El nombre es requerido', true); return; }

    const body = { nombre };
    const color       = document.getElementById('c-color').value.trim();
    const familia     = document.getElementById('c-familia').value.trim();
    const descripcion = document.getElementById('c-descripcion').value.trim();
    const precio      = document.getElementById('c-precio').value;
    const temporada   = document.getElementById('c-temporada').value;
    const disponible  = document.getElementById('c-disponible').value;

    if (color)       body.color       = color;
    if (familia)     body.familia     = familia;
    if (descripcion) body.descripcion = descripcion;
    if (precio)      body.precio      = parseFloat(precio);
    if (temporada)   body.temporada   = temporada;
    body.disponible = disponible === 'true';

    try {
        const r = await fetch(BASE, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });
        const json = await r.json();
        if (json.success) {
            location.href = 'lista.html';
        } else {
            toast(json.message, true);
        }
    } catch {
        toast('No se pudo conectar con el servidor', true);
    }
}

function limpiarCrear() {
    ['c-nombre', 'c-color', 'c-familia', 'c-descripcion', 'c-precio'].forEach(id => {
        document.getElementById(id).value = '';
    });
    document.getElementById('c-temporada').value = '';
    document.getElementById('c-disponible').value = 'true';
}

function toast(msg, error = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (error ? ' error' : '');
    setTimeout(() => { el.className = 'toast'; }, 2800);
}
</script>
</body>
</html>
